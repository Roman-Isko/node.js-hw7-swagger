tags:
  - Contacts
summary: Видалити контакт за ID
operationId: deleteContact
description: Видаляє контакт користувача з бази даних
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: ID контакту
responses:
  '200':
    description: Контакт успішно видалено
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Contact deleted successfully
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../../components/responses/error.yaml'
